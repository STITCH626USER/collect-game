<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Collect! - The Wild Card Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="app-container">
        <button id="btn-help" class="btn-help" onclick="ui.showHelpModal()">❓</button>
        
        <!-- ================= HELP MODAL ================= -->
        <div id="help-modal" class="overlay">
            <div class="overlay-content bounce-in">
                <h2>Règles & Pouvoirs</h2>
                <div class="help-grid" id="help-grid">
                    <!-- Rempli dynamiquement -->
                </div>
                <button class="btn btn-main" style="margin-top: 20px;" onclick="document.getElementById('help-modal').style.display='none'">Fermer</button>
            </div>
        </div>
        
        <!-- ================= HOME SCREEN ================= -->
        <div id="screen-home" class="screen active">
            <div class="logo-container bounce-in">
                <h1 class="logo-title">Le <span class="crowned-r">R<span class="crown-icon">👑</span></span>oi</h1>
                <h1 class="logo-title">des Animaux</h1>
            </div>
            <div class="menu-actions fade-in-up">
                <button class="btn btn-main" onclick="ui.showScreen('screen-host')">Créer un Salon</button>
                <button class="btn btn-secondary" onclick="ui.showScreen('screen-join')">Rejoindre</button>
            </div>
            <div class="version-badge">Version 2.00</div>
        </div>

        <!-- ================= HOST / WAITING ROOM ================= -->
        <div id="screen-host" class="screen">
            <button class="btn-back" onclick="ui.showScreen('screen-home')">⬅ Retour</button>
            <h2>Votre Salon</h2>
            <div class="room-code-box">
                <span class="label">Code du Salon :</span>
                <span id="room-code-display" class="code">----</span>
            </div>
            
            <div class="players-list-container">
                <h3>Joueurs (<span id="player-count">1</span>/8)</h3>
                <ul id="waiting-players-list">
                    <!-- Li ajoutés via JS -->
                </ul>
            </div>
            
            <div class="host-actions">
                <button class="btn btn-secondary" onclick="game.addBot()">+ Ajouter un Bot</button>
                <button class="btn btn-main pulse" onclick="game.startGame()" id="btn-start-game">Démarrer la Partie</button>
            </div>
            <p id="host-msg" class="msg"></p>
        </div>

        <!-- ================= JOIN ================= -->
        <div id="screen-join" class="screen">
            <button class="btn-back" onclick="ui.showScreen('screen-home')">⬅ Retour</button>
            <h2>Rejoindre</h2>
            <div class="join-box">
                <input type="tel" id="input-room-code" placeholder="Code à 4 chiffres" maxlength="4" pattern="[0-9]*">
                <input type="text" id="input-player-name" placeholder="Votre Pseudo" maxlength="10">
                <button class="btn btn-main" onclick="game.joinRoom()">Connexion</button>
            </div>
            <p id="join-msg" class="msg"></p>
        </div>

        <!-- ================= GAME BOARD ================= -->
        <div id="screen-game" class="screen">
            
            <!-- Bandeau haut : Adversaires -->
            <div class="opponents-carousel" id="opponents-carousel">
                <!-- Les adversaires seront injectés ici -->
            </div>

            <!-- Centre : Pioche et Action -->
            <div class="center-board">
                <div class="turn-indicator" id="turn-indicator">En attente...</div>
                
                <div class="decks-area" id="decks-area">
                    <div class="deck" id="deck-left" onclick="game.drawCard(1)">
                        <img src="assets/card_back.jpg" alt="Deck 1">
                        <img src="" id="deck-left-thumbnail" class="deck-thumbnail" style="display:none;" alt="Rejected Card">
                        <span class="deck-count" id="deck-left-count">32</span>
                    </div>

                    <div class="deck" id="deck-right" onclick="game.drawCard(2)">
                        <img src="assets/card_back.jpg" alt="Deck 2">
                        <img src="" id="deck-right-thumbnail" class="deck-thumbnail" style="display:none;" alt="Rejected Card">
                        <span class="deck-count" id="deck-right-count">32</span>
                    </div>
                </div>

                <!-- ================= ACTION FLOATING PANEL ================= -->
                <div id="action-modal" style="display:none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; flex-direction: column; align-items: center; gap: 15px; width: 100%; max-width: 320px; pointer-events: none;">
                    <div style="pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%;">
                        <div class="card drawn-card shadow-pop" id="drawn-card" style="width: clamp(120px, 30vw, 180px); aspect-ratio: 2/3; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); border: 4px solid white;">
                            <img src="" id="drawn-card-img" alt="Card" style="width: 100%; height: 100%; border-radius: inherit;">
                        </div>
                        <div class="card-actions" id="card-actions" style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; margin-top: 0;">
                            <!-- Actions will be injected here by JS -->
                        </div>
                        <div class="placement-actions" id="placement-actions" style="display:none; flex-direction: row; justify-content: center; gap: 10px; width: 100%; max-width: 280px;">
                            <!-- Placements injected here -->
                        </div>
                    </div>
                </div>

            </div>

            <!-- Bas : Joueur Local -->
            <div class="local-player-area">
                <div class="player-header">
                    <span class="player-name">Vous (<span id="my-score">0</span> 👑)</span>
                </div>
                <div class="my-collection row" id="my-row">
                    <!-- Mes cartes -->
                </div>
            </div>
        </div>

        <!-- ================= PARROT MODAL ================= -->
        <div id="parrot-modal" class="overlay">
            <div class="overlay-content bounce-in">
                <h2>Prédiction 🦜</h2>
                <p>Quel animal allez-vous piocher ?</p>
                <div class="animal-grid" id="parrot-animal-grid">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>


        <!-- ================= TOAST BANNER ================= -->
        <div id="overlay-msg" class="toast-banner">
            <div id="overlay-content">
                <h3 id="overlay-title"></h3>
                <p id="overlay-desc"></p>
                <div id="overlay-btn-container" style="margin-top: 15px;"></div>
            </div>
        </div>

        <!-- ================= VICTORY MODAL ================= -->
        <div id="victory-modal" class="overlay" style="display: none;">
            <div class="overlay-content victory-content bounce-in">
                <h1 id="victory-title">VICTOIRE ! 🎉</h1>
                <h3 id="victory-subtitle">Joueur a gagné !</h3>
                <div class="victory-cards" id="victory-cards">
                    <!-- Winning cards displayed here -->
                </div>
                <button class="btn btn-main" id="btn-rematch" style="margin-top:20px;" onclick="game.sendAction('REMATCH')">Rejouer une manche</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
    <div class="version-badge">v3.01</div>
</body>
</html>
